name: publish-subscriptions

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_SUB_URL: ${{ secrets.UPSTREAM_SUB_URL }}
      UPSTREAM_SUB_URLS: ${{ secrets.UPSTREAM_SUB_URLS }}
      MESL_SUB_URL: ${{ secrets.MESL_SUB_URL }}
      MESL_SUB_TEXT: ${{ secrets.MESL_SUB_TEXT }}
      LINUXDO_SUB_URL: ${{ secrets.LINUXDO_SUB_URL }}
      LINUXDO_SUB_TEXT: ${{ secrets.LINUXDO_SUB_TEXT }}
      PINCHE_SUB_URL: ${{ secrets.PINCHE_SUB_URL }}
      PUBLIC_BASE_URL: https://suehn.github.io/mihomo-subscription-builder
      PRIVATE_BASE_URL: ${{ secrets.PRIVATE_BASE_URL }}
      PRIVATE_SSH_HOST: ${{ secrets.PRIVATE_SSH_HOST }}
      PRIVATE_SSH_USER: ${{ secrets.PRIVATE_SSH_USER }}
      PRIVATE_SSH_PORT: ${{ secrets.PRIVATE_SSH_PORT }}
      PRIVATE_SSH_PATH: ${{ secrets.PRIVATE_SSH_PATH }}
      PRIVATE_SSH_KEY: ${{ secrets.PRIVATE_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run unit tests
        run: python -m pytest

      - name: Select publish mode
        run: python -m subscription_builder.cli select-publish-mode --github-env "$GITHUB_ENV"

      - name: Build artifacts
        run: PRIVATE_BASE_URL="$EFFECTIVE_PRIVATE_BASE_URL" python -m subscription_builder.cli build-all

      - name: Validate artifacts
        run: python -m subscription_builder.cli validate

      - name: Prepare public Pages artifact
        run: python -m subscription_builder.cli prepare-public-pages

      - name: Deploy private full subscriptions
        if: env.PRIVATE_DEPLOY_ENABLED == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATE_SSH_KEY" > ~/.ssh/private_deploy_key
          chmod 600 ~/.ssh/private_deploy_key
          SSH_PORT="${PRIVATE_SSH_PORT:-22}"
          case "$PRIVATE_SSH_PATH" in
            ""|"/"|"."|"~")
              echo "Refusing unsafe PRIVATE_SSH_PATH: $PRIVATE_SSH_PATH" >&2
              exit 1
              ;;
          esac
          ssh-keyscan -t ed25519,rsa -p "$SSH_PORT" "$PRIVATE_SSH_HOST" >> ~/.ssh/known_hosts
          SSH_OPTIONS=(
            -i "$HOME/.ssh/private_deploy_key"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )
          ssh "${SSH_OPTIONS[@]}" "$PRIVATE_SSH_USER@$PRIVATE_SSH_HOST" "mkdir -p '$PRIVATE_SSH_PATH'"
          SSH_COMMAND="ssh -i $HOME/.ssh/private_deploy_key -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6"
          rsync -az --delete -e "$SSH_COMMAND" dist/ "$PRIVATE_SSH_USER@$PRIVATE_SSH_HOST:$PRIVATE_SSH_PATH/"
          private_http_host="$(python -c 'import os, urllib.parse; print(urllib.parse.urlsplit(os.environ["EFFECTIVE_PRIVATE_BASE_URL"]).hostname or "")')"
          private_http_path="$(python -c 'import os, urllib.parse; print(urllib.parse.urlsplit(os.environ["EFFECTIVE_PRIVATE_BASE_URL"]).path.rstrip("/"))')"
          health="$(
            ssh "${SSH_OPTIONS[@]}" "$PRIVATE_SSH_USER@$PRIVATE_SSH_HOST" bash -s -- \
              "$PRIVATE_SSH_PATH" "$private_http_host" "$private_http_path" <<'REMOTE_HEALTH'
          root="$1"
          http_host="$2"
          http_path="$3"
          files=missing
          if test -s "$root/mihomo-full.yaml" && test -s "$root/mihomo-generic.yaml" && test -s "$root/shadowrocket.conf"; then
            files=ok
          fi
          services=""
          if command -v systemctl >/dev/null 2>&1; then
            for service in nginx caddy apache2 httpd; do
              if systemctl is-active --quiet "$service" 2>/dev/null; then
                services="${services:+$services,}$service"
              fi
            done
          fi
          services="${services:-none}"
          listeners=unknown
          if command -v ss >/dev/null 2>&1; then
            listeners="$(ss -H -ltn 2>/dev/null | awk '$4 ~ /:80$|:443$/ { count++ } END { print count+0 }')"
          fi
          public_http_listener=no
          if command -v ss >/dev/null 2>&1 && ss -H -ltn 2>/dev/null | awk '{ print $4 }' | grep -Eq '^(\*|0\.0\.0\.0|\[::\]):80$'; then
            public_http_listener=yes
          fi
          nginx_mapping=no
          if command -v grep >/dev/null 2>&1 && grep -R -F -q -- "$root" /etc/nginx 2>/dev/null; then
            nginx_mapping=yes
          fi
          firewall=unknown
          if command -v ufw >/dev/null 2>&1; then
            ufw_status="$(sudo -n ufw status 2>/dev/null || ufw status 2>/dev/null || true)"
            if printf '%s\n' "$ufw_status" | grep -q '^Status: inactive'; then
              firewall=ufw-inactive
            elif printf '%s\n' "$ufw_status" | grep -q '^Status: active'; then
              if printf '%s\n' "$ufw_status" | grep -Eq '^80(/tcp)?[[:space:]]+ALLOW'; then
                firewall=ufw-http-allowed
              else
                firewall=ufw-http-blocked
              fi
            else
              firewall=ufw-unreadable
            fi
          elif command -v firewall-cmd >/dev/null 2>&1; then
            if firewall-cmd --quiet --query-service=http 2>/dev/null; then
              firewall=firewalld-http-allowed
            else
              firewall=firewalld-http-blocked
            fi
          fi
          sudo_access=no
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo_access=yes
            iptables_command=""
            if command -v iptables >/dev/null 2>&1; then
              iptables_command="$(command -v iptables)"
            elif test -x /usr/sbin/iptables; then
              iptables_command=/usr/sbin/iptables
            fi
            if test "$firewall" = unknown && test -n "$iptables_command"; then
              input_rules="$(sudo -n "$iptables_command" -S INPUT 2>/dev/null || true)"
              if printf '%s\n' "$input_rules" | grep -Eq -- '-p tcp .*--dport 80 .*-(j|g) ACCEPT'; then
                firewall=iptables-http-allowed
              elif printf '%s\n' "$input_rules" | grep -q '^-P INPUT ACCEPT'; then
                firewall=iptables-input-accept
              elif printf '%s\n' "$input_rules" | grep -q '^-P INPUT DROP'; then
                firewall=iptables-http-blocked
              else
                firewall=iptables-unresolved
              fi
            fi
            if test "$firewall" = unknown && command -v nft >/dev/null 2>&1; then
              nft_rules="$(sudo -n nft list ruleset 2>/dev/null || true)"
              if printf '%s\n' "$nft_rules" | grep -Eq 'tcp dport 80 .*accept'; then
                firewall=nft-http-allowed
              elif printf '%s\n' "$nft_rules" | grep -Eq 'hook input .*policy drop'; then
                firewall=nft-http-blocked
              else
                firewall=nft-unresolved
              fi
            fi
          fi
          http=unavailable
          https=unavailable
          if command -v curl >/dev/null 2>&1; then
            http="$(curl --ipv4 --http1.1 --silent --insecure --output /dev/null --write-out '%{http_code}' --connect-timeout 3 --max-time 5 http://127.0.0.1/ 2>/dev/null || true)"
            https="$(curl --ipv4 --http1.1 --silent --insecure --output /dev/null --write-out '%{http_code}' --connect-timeout 3 --max-time 5 https://127.0.0.1/ 2>/dev/null || true)"
            http="${http:-000}"
            https="${https:-000}"
          fi
          artifact_http=unavailable
          if command -v curl >/dev/null 2>&1; then
            artifact_http="$(curl --ipv4 --http1.1 --silent --output /dev/null --write-out '%{http_code}' \
              --header "Host: $http_host" --connect-timeout 3 --max-time 5 \
              "http://127.0.0.1${http_path}/mihomo-full.yaml" 2>/dev/null || true)"
            artifact_http="${artifact_http:-000}"
          fi
          printf 'files=%s services=%s listeners=%s public_http=%s nginx_mapping=%s firewall=%s sudo=%s localhost_http=%s localhost_https=%s artifact_http=%s\n' \
            "$files" "$services" "$listeners" "$public_http_listener" "$nginx_mapping" "$firewall" "$sudo_access" "$http" "$https" "$artifact_http"
          REMOTE_HEALTH
          )"
          echo "::notice title=Private web health::$health"

      - name: Verify private subscription URLs
        if: env.PRIVATE_DEPLOY_ENABLED == 'true'
        run: |
          verify_dir="$(mktemp -d)"
          private_base_url="${EFFECTIVE_PRIVATE_BASE_URL%/}"
          for artifact in mihomo-full.yaml mihomo-android.yaml mihomo-generic.yaml shadowrocket.conf shadowrocket-subscription.txt; do
            echo "Checking $artifact"
            curl --ipv4 --http1.1 --fail --silent --show-error --location --retry 1 --retry-all-errors \
              --connect-timeout 8 --max-time 20 \
              "$private_base_url/$artifact?build=$GITHUB_SHA" -o "$verify_dir/$artifact"
            test -s "$verify_dir/$artifact"
          done
          grep -q '^proxies:' "$verify_dir/mihomo-full.yaml"
          grep -q 'name: 🔁 故障转移' "$verify_dir/mihomo-full.yaml"
          grep -q '^proxy-groups:' "$verify_dir/mihomo-generic.yaml"
          grep -q '^\[Proxy Group\]' "$verify_dir/shadowrocket.conf"
          grep -q '^🔁 故障转移 = fallback' "$verify_dir/shadowrocket.conf"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_ARTIFACT_PATH }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public rules URL
        run: |
          page_url="${{ steps.deployment.outputs.page_url }}"
          page_url="${page_url%/}"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors \
            --connect-timeout 15 --max-time 60 "$page_url/rules/mihomo/private.yaml?build=$GITHUB_SHA" -o /dev/null
